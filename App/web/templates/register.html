<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Програмування вебзастосунків на Go</title>
    <link rel="stylesheet" href="../static/css/main.css" />
  </head>

  <body>
    <div id="page" class="site" style="background: url(https://ipze.kpi.ua/wp-content/themes/ipze_new-master/assets/img/background.svg) no-repeat; min-height: 100vh;  ">
      <main class="page-container">
        <div class="register-content">
          <div class="course-block-title">
            <h1>Програмування вебзастосунків на Go</h1>
          </div>
            <div class="return-block">
              <a href="/"><button  class="reveal-button"><svg width="45" height="45" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><p>Повернутися</p></button></a>
          </div>
          <form class="aut-form" action="/register" method="POST">
            {{ .csrfField }}
            <div class="aut-form-content">
              <div class="centered-block">
                <h2>Реєстрація</h2>
              </div>

              <div class="login-block">
                <p>Введіть адресу електронної пошти:</p>
                <input class="input-field" type="email" name="email" />
              </div>

              <div class="login-block">
                <p>Введіть дійсне Прізвище, Ім'я, Побатькові</p>
                <input class="input-field" name="username"/>
              </div>

              <div class="login-block">
                <p>Введіть пароль:</p>
                <input type="password" class="input-field" name="password" />
              </div>

              <div class="login-block">
                <p>Підтвердіть пароль:</p>
                <input type="password" class="input-field" name="passwordConfirm" />
              </div>
{{ if .Error }}
  <div class="error-block">
    {{ .Error }}
  </div>
{{ end }}
              <div class="centered-block login-btn-container">
                <button type="submit">Реєстрація</button>
              </div>
              <div class="login-block centered-text">
                <p>
                  Вже маєте обліковий запис? <a href="/login">Вхід</a>
                </p>
              </div>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
